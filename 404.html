<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redirecting to latincy.github.io/latincy-book</title>
  <script>
    var path = window.location.pathname.replace(/^\/latincy-book\//, '');
    window.location.replace("https://latincy.github.io/latincy-book/" + path + window.location.search + window.location.hash);
  </script>
</head>
<body>
  <p>This site has moved to <a href="https://latincy.github.io/latincy-book/">latincy.github.io/latincy-book</a>.</p>
</body>
</html>
